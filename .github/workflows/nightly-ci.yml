name: Nightly
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *' # UTC 16:00 / GMT+8 0:00, daily

env:
  CI_NAME: Nightly CI
jobs:
  build:
    if: ${{ github.repository == 'jianghuaangte/trime' && github.ref == 'refs/heads/3.2.19' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v4
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup keystore
        run: |
          echo ${{ secrets.SIGNING_KEY }} | base64 --decode | cat >> $(pwd)/signingkey.jks
          cat << EOF > keystore.properties
          storeFile=$(pwd)/signingkey.jks
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Download 092wb private branch
        run: |
          pwd
          rm -rf app/src/main/assets/rime/*
          wget https://github.com/mlzzz/092wb/archive/refs/heads/private.zip -O 092wb.zip
          unzip 092wb.zip -d app/src/main/assets/rime/
          mv app/src/main/assets/rime/092wb-private/* app/src/main/assets/rime/
          cp -r theme/* app/src/main/assets/rime/
          rm -rf app/src/main/assets/rime/092wb-private/
          rm -rf app/src/main/assets/rime/{.git,recipes/,.gitignore,README.md,squirrel.yaml,weasel.yaml}
          echo "列出所有文件："
          ls app/src/main/assets/rime/

      - name: Build Trime
        run: make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Create Nightly release
        uses: 'marvinpinto/action-automatic-releases@latest'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: nightly
          prerelease: true
          title: "Nightly Build"
          files: |
            app/build/outputs/apk/release/*.apk
