name: Sync Secrets to Repositories

# 你可以手动触发这个工作流，或者在 push 到 main 分支时触发，以便在更新密钥后自动同步。
on:
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发
  push:
    branches: [ "3.2.19" ]
    # 你可以指定只有更改特定文件时才触发，例如包含密钥的文件
    # paths:
    #   - '.env.example'

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Sync Secrets
        uses: jpoehnelt/secrets-sync-action@latest # 建议使用固定版本或最新稳定版
        with:
          # 必需：使用之前创建好的 PAT
          github_token: ${{ secrets.PERSONAL_GH_TOKEN_CLASSIC }}

          # 必需：定义要同步哪些仓库（支持正则表达式）
          repositories: |
            ^mlzzz/Trime-092wb-actions$   # 同步另一个 mlzzz 下的一个非常具体的仓库

          # 必需：定义要同步哪些环境变量（支持正则表达式）
          # 这些变量来自本步骤的 `env` 部分
          secrets: |
            ^KEY_PASSWORD$
            ^ALIAS$
            ^KEY_STORE_PASSWORD$
            ^SIGNING_KEY$

          # 可选：是否只是模拟运行（不真正执行写入操作）。设为 false 后才真正同步。
          dry_run: false

          # 可选：如果设为 true，则会删除目标仓库中匹配的 secrets。慎用！
          delete: false

          # 可选：并发数，默认10。如果遇到速率限制可以调低。
          concurrency: 5

          # 可选：同步到哪个目标，默认是 Actions secrets。还可以是 codespaces 或 dependabot
          target: actions

          # 可选：如果设置了环境名称，则会同步到该环境的 Secrets，而不是仓库的 Secrets。
          # environment: production

        # 必需：在这里定义你要同步的密钥和它们的值。
        # 这些值通常来自“源”仓库的 Secrets 或 Variables。
        env:
          # 这个 FOO 的值可以是硬编码的，但更常见的是引用“源”仓库的 secret
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          # 这个 GITHUB_TOKEN 示例可以是另一个 token
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 这个 DATABASE_URL 也可以来自仓库的 Variables
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
