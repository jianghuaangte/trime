name: 🔑 Sync Secrets to mlzzz/actions

on:
  workflow_dispatch:   # 手动触发，避免误操作
  push:
    branches:
      - 3.2.19           # main 分支推送时自动触发

jobs:
  sync-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Secrets
        uses: jpoehnelt/secrets-sync-action@v1.10.0
        with:
          # 要同步的 secret 名称（正则匹配）
          secrets: |
            ^KEY_PASSWORD$
            ^ALIAS$
            ^KEY_STORE_PASSWORD$
            ^SIGNING_KEY$


          # 目标仓库是私有仓库 mlzzz/actions，所以用固定列表
          repositories_list_regex: false
          repositories: |
            mlzzz/Trime-092wb-actions

          # 提供 PAT（必须是 classic 或 fine-grained，有 repo 和 secrets 权限）
          github_token: ${{ secrets.PERSONAL_GH_TOKEN_CLASSIC }}

          # dry_run 建议先开，确认无误后改成 false
          dry_run: false

        env:

          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          # 这个 GITHUB_TOKEN 示例可以是另一个 token
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # 这个 DATABASE_URL 也可以来自仓库的 Variables
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
